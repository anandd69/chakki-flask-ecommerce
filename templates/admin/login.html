<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login – Chakki Premium</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#0F0A04;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-wrap{width:100%;max-width:400px;padding:1rem}
.login-card{background:#1A1208;border:1px solid rgba(200,146,42,0.2);border-radius:20px;padding:2.5rem}
.login-logo{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:#E8B84B;text-align:center;margin-bottom:0.5rem}
.login-logo span{color:#fff;font-style:italic}
.login-sub{text-align:center;color:#8A7560;font-size:0.85rem;margin-bottom:2rem}
.form-group{margin-bottom:1.2rem}
label{display:block;font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#8A7560;margin-bottom:0.4rem}
input{width:100%;padding:0.8rem 1rem;background:#251A0C;border:1px solid rgba(200,146,42,0.2);border-radius:8px;color:#EDE0CC;font-size:0.95rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s}
input:focus{border-color:#C8922A}
.error-msg{background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.3);color:#e74c3c;padding:0.75rem 1rem;border-radius:8px;font-size:0.85rem;margin-bottom:1.2rem}
.login-btn{width:100%;padding:0.9rem;background:#C8922A;color:#fff;border:none;border-radius:40px;font-size:1rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background 0.2s}
.login-btn:hover{background:#E8B84B;color:#111}
.login-hint{text-align:center;color:#5a4a38;font-size:0.78rem;margin-top:1.2rem}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">Chakki <span>Admin</span></div>
    <div class="login-sub">Sign in to manage your store</div>
    {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="admin" autofocus required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="login-btn">Sign In →</button>
    </form>
  </div>
</div>
</body>
</html>
